name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.part }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/mailflow-${{ matrix.part }}:4.5.1
